{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="auth-card card wide">
  <h1>{{ title }}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'accounts/_form_fields.html' %}
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-ghost" href="javascript:history.back()">Cancel</a>
  </form>
</section>
{% endblock %}
