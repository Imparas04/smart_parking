<header class="navbar">
  <div class="container nav-inner">
    <a class="brand" href="{% url 'core:home' %}">P <span>{{ SITE_NAME }}</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
    <nav class="nav-links" id="navLinks">
      <a href="{% url 'core:home' %}">Home</a>
      <a href="{% url 'parking:location_list' %}">Parking</a>
      {% if user.is_authenticated %}
        {% if user.profile.is_admin_role %}<a href="{% url 'dashboard:index' %}">Dashboard</a>{% endif %}
        <a href="{% url 'accounts:profile' %}">{{ user.first_name|default:user.username }}</a>
        <form method="post" action="{% url 'accounts:logout' %}" class="inline-form">
          {% csrf_token %}
          <button class="btn btn-ghost" type="submit">Logout</button>
        </form>
      {% else %}
        <a class="btn btn-ghost" href="{% url 'accounts:login' %}">Login</a>
        <a class="btn btn-primary" href="{% url 'accounts:register' %}">Register</a>
      {% endif %}
    </nav>
  </div>
</header>
