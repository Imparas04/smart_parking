{% with ns=request.resolver_match.namespace %}
<header class="navbar">
  <div class="container nav-inner">
    <a class="brand" href="{% url 'core:home' %}">P <span>{{ SITE_NAME }}</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navLinks">&#9776;</button>
    <nav class="nav-links" id="navLinks" aria-label="Main">
      <a href="{% url 'core:home' %}" {% if ns == 'core' %}class="active" aria-current="page"{% endif %}>Home</a>
      <a href="{% url 'parking:location_list' %}" {% if ns == 'parking' %}class="active" aria-current="page"{% endif %}>Parking</a>
      {% if user.is_authenticated %}
        {% if user.profile.is_admin_role %}<a href="{% url 'dashboard:index' %}" {% if ns == 'dashboard' %}class="active" aria-current="page"{% endif %}>Dashboard</a>{% endif %}
        <a href="{% url 'bookings:history' %}" {% if ns == 'bookings' or ns == 'payments' %}class="active" aria-current="page"{% endif %}>My Bookings</a>
        <a href="{% url 'accounts:profile' %}" {% if ns == 'accounts' %}class="active" aria-current="page"{% endif %}>{{ user.first_name|default:user.username }}</a>
        <form method="post" action="{% url 'accounts:logout' %}" class="inline-form">
          {% csrf_token %}
          <button class="btn btn-ghost" type="submit">Logout</button>
        </form>
      {% else %}
        <a class="btn btn-ghost" href="{% url 'accounts:login' %}">Login</a>
        <a class="btn btn-primary" href="{% url 'accounts:register' %}">Register</a>
      {% endif %}
    </nav>
  </div>
</header>
{% endwith %}
