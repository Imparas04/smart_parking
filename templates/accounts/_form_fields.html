{% if form.non_field_errors %}<div class="alert alert-error" role="alert"><span>{{ form.non_field_errors|striptags }}</span></div>{% endif %}
{% for field in form %}
<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req" aria-hidden="true"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="help">{{ field.help_text|safe }}</small>{% endif %}
  {% if field.errors %}<div class="errors" id="{{ field.id_for_label }}_errors">{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</div>{% endif %}
</div>
{% endfor %}
