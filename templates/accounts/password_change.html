{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Change password</h1>

    {% csrf_token %}
    {% include 'accounts/_form_fields.html' %}

  </form>
</section>
{% endblock %}
