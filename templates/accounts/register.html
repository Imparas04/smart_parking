{% extends 'base.html' %}
{% load static %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-layout">
  <div class="auth-aside"><img src="{% static 'img/auth-art.svg' %}" alt="" width="520" height="560"></div>
  <section class="auth-panel">
    <h1>Create your account</h1>
    <p class="muted">It takes under a minute. Then book your first bay.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'accounts/_form_fields.html' %}
      <button class="btn btn-primary btn-block btn-lg" type="submit">Register</button>
    </form>
    <p class="muted stack-top">Already registered? <a href="{% url 'accounts:login' %}">Login</a></p>
  </section>
</div>
{% endblock %}
